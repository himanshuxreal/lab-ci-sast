name: CI Build Test and SAST 
 
on: 
  push: 
    branches: [main, development, testing] 
  pull_request: 
    branches: [main] 
  workflow_dispatch: 
 
permissions: 
  contents: read 
 
jobs: 
  build-test-sast: 
    runs-on: ubuntu-latest 
 
    steps: 
      - name: Checkout Code 
        uses: actions/checkout@v4 
 
      - name: Setup Python 
        uses: actions/setup-python@v5 
        with: 
          python-version: "3.12" 
 
      - name: Install Dependencies 
        run: pip install -r requirements.txt 
 
      - name: Build Check 
        run: python -m compileall -q . 
 
      - name: Run Tests 
        run: pytest -v 
 
      - name: Run SAST Scan 
        run: bandit -r . -x ./tests 